<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>coNNex - Active Investments</title>

    <link rel="stylesheet" href="manageinvestment.css">
</head>

<body>

<main class="page">

    <!-- <header class="page-header">
        <div>
            <p class="eyebrow">coNNex ADMIN</p>
            <h1>Add / Active investments</h1>
            <p class="subheading">
                Create and monitor investment records.
            </p>
        </div>

        <span class="demo-badge">CNX</span>
    </header> -->

    <!-- ADMIN INVESTMENT FORM -->

    <section class="admin-panel">

        <div class="section-heading">
            <div>
                <h2>Add investment</h2>
                <p>Search for an investor, choose a plan and enter an amount.</p>
            </div>
        </div>

        <form id="investmentForm" class="form-grid">

            <!-- SEARCH INVESTOR -->

            <label class="investor-field">
                Search investor

                <input
                    type="text"
                    id="customerSearch"
                    placeholder="Search investor name or username..."
                    autocomplete="off"
                    required
                >

                <input type="hidden" id="customer">

                <div
                    id="customerResults"
                    class="customer-results"
                    hidden
                ></div>

                <small id="selectedCustomer" class="selected-customer">
                    No investor selected.
                </small>
            </label>

            <!-- INVESTMENT PLAN -->

            <label>
                Investment Plan

                <select id="plan" required>

                    <option value="basic">
                        Basic Plan — 24 hours
                    </option>

                    <option value="standard">
                        Standard Plan — 7 days
                    </option>

                    <option value="premium">
                        Premium Plan — 30 days
                    </option>

                    <option value="longterm">
                        Long-term Plan — 6 months
                    </option>

                </select>
            </label>

            <!-- INVESTMENT AMOUNT -->

            <label>
                Amount (USD)

                <input
                    type="number"
                    id="amount"
                    min="100"
                    step="0.01"
                    placeholder="Minimum 100.00"
                    required
                >
            </label>

            <div class="form-action">
                <button type="submit" class="primary-button">
                    Add as pending
                </button>
            </div>

        </form>

    </section>

    <!-- ACTIVE INVESTMENTS TABLE -->

    <section class="table-card">

        <div class="table-heading">

            <div>
                <h2>Active investments</h2>
                <p>Monitor investment status and countdowns.</p>
            </div>

            <button id="clearDemo" class="text-button" type="button">
                Clear records
            </button>

        </div>

        <div class="table-scroll">

            <table>

                <thead>
                    <tr>
                        <th>Investor</th>
                        <th>Plan</th>
                        <th>Amount</th>
                        <th>Started</th>
                        <th>Ends</th>
                        <th>Status</th>
                        <th>Countdown / Progress</th>
                        <th>Admin</th>
                    </tr>
                </thead>

                <tbody id="investmentRows">

                    <tr class="empty-row">
                        <td colspan="8">
                            No investment records yet.
                            Add one using the form above.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="manageinvestment.js"></script>

</body>
</html>
